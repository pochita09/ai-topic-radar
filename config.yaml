ai:
  provider: gemini
  # gemini-2.5-flash-lite は新しいAPIキーでは 404 になるため移行先を指定する。
  model: gemini-3.5-flash-lite

# Worker URLの差し替えはここ1箇所だけでよい（/feedback, /config は共通のWorkerのパス違い）。
worker_url: "https://ai-topic-radar-feedback.takaline.workers.dev"

run:
  # 実行時刻は .github/workflows/monitor.yml の cron が正。
  keep_below_threshold: true
  read_dim_enabled: true

themes:
  - topic_id: ai-models
    name: AI検証ネタ
    display_name: AI検証ネタ
    # Phase4: 採点を2軸に変更。加重とverification_thresholdはユーザー設定値として
    # KVから上書きできる（Worker設定画面で調整、pushせずに変更できる状態を維持）。
    intro_weight: 0.4
    verification_weight: 0.6
    verification_threshold: 3
    sheet_tab: AIモデル系
    sources:
      - name: OpenAI News
        source_id: openai-news
        url: https://openai.com/news/rss.xml
      - name: Google DeepMind Blog
        source_id: deepmind-blog
        url: https://deepmind.google/blog/rss.xml
      # Phase3実測: anthropic.com直下のrss.xml等の一般的なパスは全て404、
      # /newsページ内にもfeed用linkタグなし。公式RSS/Atomは存在しないことを確認済み。
      # コミュニティミラー（Phase0/1で継続稼働を確認済み）をそのまま採用。
      - name: Anthropic News
        source_id: anthropic-news
        url: https://raw.githubusercontent.com/Olshansk/rss-feeds/main/feeds/feed_anthropic_news.xml
      - name: Anthropic Research
        source_id: anthropic-research
        url: https://raw.githubusercontent.com/Olshansk/rss-feeds/main/feeds/feed_anthropic_research.xml
      # Phase3: 指示書は「CHANGELOG.mdのコミットAtomフィード」を指定していたが、
      # 実測すると直近5件すべて "chore: Update CHANGELOG.md and feed.xml" という
      # 定型botメッセージのみでtitle/summaryに実質的な情報がなかった。
      # releases.atom はバージョン番号と変更点がsummaryに構造化されているため、
      # こちらに差し替えた（feedparser経路でそのまま食えることは実測済み）。
      - name: Claude Code Releases
        source_id: claude-code-releases
        url: https://github.com/anthropics/claude-code/releases.atom
      - name: Anthropic SDK Python Releases
        source_id: anthropic-sdk-python-releases
        url: https://github.com/anthropics/anthropic-sdk-python/releases.atom
      # Phase3: Hacker News用の新規collector（src/hn_fetcher.py）。
      # urlはウォーターマーク管理用の疑似URL（last_seen.jsonのキーとしてのみ使う）。
      - name: Hacker News (AI Agent)
        source_id: hn-ai-agent
        type: hacker_news
        url: "hn-search://ai-agent"
        query: "AI agent"
        # search_by_date（新着順）は投稿直後でpointsがまだ低い。
        # ノイズ除去の最低限に留め、「HN上位」かどうかの実質判定はPhase4のGemini採点に委ねる。
        min_points: 2
    intro_criteria: |
      高評価：公式リリース・作者本人の発信 / 無料化・大幅値下げ・コスト削減 /
      作業時間削減・自動化・並列化 / 数コマンドで導入できる / 強いデモがある /
      Hacker News上位 / GitHubで急上昇 / 既存の使い方を変える可能性

      低評価：特定環境だけの小さな修正 / 実利が分からない / 手順や数字がない /
      日本語圏で消費され尽くした話題
    verification_criteria: |
      判断基準：「本当に？」という疑問が残るか / 個人の環境だけで再現できるか /
      所要時間・成功率・失敗回数・費用を測れるか / 旧方式や他ツールと比較できるか /
      失敗してもコンテンツになるか / 高額な費用が不要か / 数時間〜数日で検証可能か /
      紹介記事だけでは分からないことを追加できるか
